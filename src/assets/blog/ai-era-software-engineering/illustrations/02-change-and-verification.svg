<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1210" viewBox="0 0 1440 1210" role="img" aria-labelledby="title desc"><title id="title">需求变更与验收反馈</title><desc id="desc">按问题类型返回需求、共享设计或实现，并把证据不足与发现缺陷分开处理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57534e"/></marker></defs><rect width="1440" height="1210" fill="#faf9f6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#292724"><text x="55" y="65" font-size="34" text-anchor="start" fill="#292724" font-weight="600">出现新问题，应该返回哪一步？</text><text x="55" y="103" font-size="20" text-anchor="start" fill="#78716c" font-weight="400">变更路由（Change Routing）与验收反馈（Verification Feedback）</text><rect x="540" y="140" width="360" height="76" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="720.0" y="176.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">执行当前 Ticket</text><text x="720.0" y="202.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">已存在的交付任务</text><path d="M720 216 V257" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="260" width="360" height="64" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="720.0" y="299.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">判断问题类型</text><path d="M720 324 V350 H245 V424" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="109" y="370" width="272" height="34" rx="0" fill="#faf9f6" stroke="none" stroke-width="1.5"/><text x="245" y="394" font-size="18" text-anchor="middle" fill="#292724" font-weight="400">行为或验收未定</text><rect x="105" y="428" width="280" height="86" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="245.0" y="469.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">澄清决定并修订 SPEC</text><text x="245.0" y="495.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">需求规范 · Specification</text><path d="M720 324 V350 H560 V424" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="424" y="370" width="272" height="34" rx="0" fill="#faf9f6" stroke="none" stroke-width="1.5"/><text x="560" y="394" font-size="18" text-anchor="middle" fill="#292724" font-weight="400">共享设计约定缺失</text><rect x="420" y="428" width="280" height="86" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="560.0" y="469.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">修订 HLD</text><text x="560.0" y="495.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">概要设计 · High-Level Design</text><path d="M720 324 V350 H875 V424" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="739" y="370" width="272" height="34" rx="0" fill="#faf9f6" stroke="none" stroke-width="1.5"/><text x="875" y="394" font-size="18" text-anchor="middle" fill="#292724" font-weight="400">既定范围内的缺陷</text><rect x="735" y="428" width="280" height="86" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="875.0" y="469.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">修复实现</text><text x="875.0" y="495.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">保持已确认的需求与设计</text><path d="M720 324 V350 H1190 V424" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="1054" y="370" width="272" height="34" rx="0" fill="#faf9f6" stroke="none" stroke-width="1.5"/><text x="1190" y="394" font-size="18" text-anchor="middle" fill="#292724" font-weight="400">未发现上述问题</text><rect x="1050" y="428" width="280" height="86" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="1190.0" y="469.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">进入验证与审查</text><text x="1190.0" y="495.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">Verification / Code Review</text><path d="M245 514 V549 H405 V578" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 514 V549 H405 V578" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="200" y="582" width="410" height="82" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="405.0" y="621.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">评估设计影响并更新 Tickets</text><text x="405.0" y="647.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">仅修订受影响的设计与执行任务</text><path d="M200 623 H80 V178 H540" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="95" y="567" font-size="17" text-anchor="start" fill="#292724" font-weight="400">恢复执行</text><path d="M875 514 V597 H1000 V696" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><path d="M1190 514 V597 H1000" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="700" width="420" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="1000.0" y="737.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">验证与审查</text><text x="1000.0" y="763.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">检查实现与证据是否支持当前验收</text><path d="M1000 778 V819" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><rect x="790" y="823" width="420" height="70" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="1000.0" y="865.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">证据支持验收吗？</text><path d="M790 858 H640 V964" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="653" y="891" font-size="18" text-anchor="start" fill="#292724" font-weight="400">支持</text><rect x="450" y="968" width="380" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="640.0" y="1005.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">记录证据并推进后续工作</text><text x="640.0" y="1031.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">保留当前验收依据</text><path d="M1000 893 V964" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="1014" y="935" font-size="18" text-anchor="start" fill="#292724" font-weight="400">证据不足</text><rect x="850" y="968" width="390" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="1045.0" y="1005.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">标记未验证并补齐条件</text><text x="1045.0" y="1031.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">Unverified · 暂不宣告交付</text><path d="M1240 1007 H1330 V739 H1210" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="1254" y="941" font-size="17" text-anchor="start" fill="#292724" font-weight="400">重新验证</text><path d="M1210 858 H1380 V292 H900" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="1359" y="686" font-size="17" text-anchor="end" fill="#292724" font-weight="400">发现缺陷</text><text x="1359" y="714" font-size="17" text-anchor="end" fill="#292724" font-weight="400">或契约缺口</text><text x="55" y="1120" font-size="23" text-anchor="start" fill="#292724" font-weight="500">返回的是受影响的决策层，仍然有效的实现与证据可以保留。</text><text x="55" y="1164" font-size="18" text-anchor="start" fill="#78716c" font-weight="400">本图聚焦已有 Ticket 的执行反馈，不要求小任务经过完整流程，也不把环境不可用视为产品缺陷。</text></g></svg>