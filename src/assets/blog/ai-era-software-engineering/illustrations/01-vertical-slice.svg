<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">一次文本回复：纵向切片</title><desc id="desc">消息发送过程依次经过客服界面、回复服务、数据存储和平台接口，并区分平台已接收与明确拒绝。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57534e"/></marker></defs><rect width="1200" height="1050" fill="#faf9f6"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif" fill="#292724"><text x="54" y="65" font-size="34" text-anchor="start" fill="#292724" font-weight="600">一次文本回复，贯穿真实链路</text><text x="54" y="102" font-size="20" text-anchor="start" fill="#78716c" font-weight="400">纵向切片（Vertical Slice） · 从提交意图到可观察的结果</text><rect x="64" y="415" width="1072" height="216" rx="8" fill="#f0efea" stroke="#d4d0c9" stroke-width="1.5"/><rect x="64" y="650" width="1072" height="218" rx="8" fill="#f5f2ed" stroke="#d4d0c9" stroke-width="1.5"/><rect x="60" y="142" width="220" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="170.0" y="179.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">客服界面</text><text x="170.0" y="205.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">User Interface</text><path d="M170 230 V895" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6"/><rect x="345" y="142" width="220" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="455.0" y="179.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">回复服务</text><text x="455.0" y="205.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">Reply Service</text><path d="M455 230 V895" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6"/><rect x="625" y="142" width="220" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="735.0" y="179.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">数据存储</text><text x="735.0" y="205.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">Persistence</text><path d="M735 230 V895" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6"/><rect x="920" y="142" width="220" height="78" rx="12" fill="#fff" stroke="#d4d0c9" stroke-width="1.5"/><text x="1030.0" y="179.0" font-size="21" text-anchor="middle" fill="#292724" font-weight="500">平台接口</text><text x="1030.0" y="205.0" font-size="15" text-anchor="middle" fill="#78716c" font-weight="400">Platform API</text><path d="M1030 230 V895" fill="none" stroke="#57534e" stroke-width="2" stroke-dasharray="7 6"/><path d="M170 274 H455" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="312.5" y="261" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">提交文本回复</text><path d="M455 328 H735" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="315" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">保存发送任务</text><path d="M455 382 H1030" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="369" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">请求发送</text><text x="185" y="449" font-size="20" text-anchor="start" fill="#292724" font-weight="500">分支 A · 平台确认已接收</text><path d="M1030 494 H455" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="481" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">返回平台消息标识</text><path d="M455 547 H735" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="534" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">记录平台已接收</text><path d="M455 600 H170" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="312.5" y="587" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">展示平台已接收</text><text x="185" y="685" font-size="20" text-anchor="start" fill="#292724" font-weight="500">分支 B · 平台明确拒绝</text><path d="M1030 729 H455" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="875" y="716" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">返回拒绝原因</text><path d="M455 782 H735" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="595.0" y="769" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">记录发送失败</text><path d="M455 835 H170" fill="none" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/><text x="312.5" y="822" font-size="19" text-anchor="middle" fill="#292724" font-weight="400">展示原因与后续操作</text><text x="64" y="931" font-size="24" text-anchor="start" fill="#292724" font-weight="500">平台已接收 ≠ 买家已收到</text><text x="64" y="970" font-size="20" text-anchor="start" fill="#78716c" font-weight="400">超时属于结果未确认的情况，需要核对状态，不能直接当作失败重发。</text><text x="64" y="1004" font-size="17" text-anchor="start" fill="#78716c" font-weight="400">示意从消息已进入会话开始，实际状态以平台协议和本次验收条件为准。</text></g></svg>